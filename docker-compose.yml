services:
  db:
    image: postgres:18.6-alpine3.24
    container_name: mediscan_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: mediscan_admin
      POSTGRES_PASSWORD: ${DB_PASSWORD:-mediscan_P@ssw0rd}
      POSTGRES_DB: mediscan_db
      PGDATA: /var/lib/postgresql/data
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql
      # Full dump: includes 01-schema.sql, 02-vault-metadata.sql, and PH FDA medicines
      - ./mediscan_full.sql:/docker-entrypoint-initdb.d/01-mediscan_full.sql:ro
      # For a clean schema without sample accounts (requires manually importing FDA rows):
      # - ./01-schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      # - ./02-vault-metadata.sql:/docker-entrypoint-initdb.d/02-vault-metadata.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mediscan_admin -d mediscan_db"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./back-end
      dockerfile: Dockerfile
    container_name: mediscan_backend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://mediscan_admin:mediscan_P%40ssw0rd@db:5432/mediscan_db
      DB_HOST: db
    ports:
      - "8000:8000"
    volumes:
      - ./back-end:/workspace/back-end
      - ./front-end:/workspace/front-end:ro
      - ./.env:/workspace/.env:ro
      - ./DATASET_LUMAKIN.csv:/workspace/DATASET_LUMAKIN.csv:ro
      - paddleocr_cache:/root/.paddleocr
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./front-end
      dockerfile: Dockerfile
    container_name: mediscan_frontend
    restart: unless-stopped
    env_file:
      - ./front-end/.env
    environment:
      EXPO_DEVTOOLS_LISTEN_ADDRESS: 0.0.0.0
      REACT_NATIVE_PACKAGER_HOSTNAME: ${HOST_IP:-192.168.1.14}
      CHOKIDAR_USEPOLLING: "true"
    ports:
      - "8081:8081"
    volumes:
      - ./front-end:/app
      - frontend_node_modules:/app/node_modules
    depends_on:
      - backend
    stdin_open: true
    tty: true

volumes:
  pgdata:
  paddleocr_cache:
  frontend_node_modules: