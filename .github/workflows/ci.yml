name: CI

on:
  pull_request:
  push:
    branches: [main, master, "feat/**"]

jobs:
  frontend:
    name: Frontend lint and typecheck
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: front-end
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: front-end/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npx tsc --noEmit
      - run: npm run test:api
      - run: npm run test:scan
      - run: npm run test:reminders

  backend:
    name: Backend pytest
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: back-end
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          pip install pytest httpx
      - name: Run unit tests
        run: python -m pytest tests/test_fda_matcher.py tests/test_ocr_linking_api.py tests/test_notifications_api.py tests/test_auth_api.py tests/test_profiles_api.py tests/test_schedules_api.py tests/test_medicine_vault_api.py -q
        env:
          VERIFICATION_CODE_PEPPER: ci-test-pepper
